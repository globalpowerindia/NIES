services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env.release.local}
    restart: unless-stopped
    env_file:
      - path: ./.env.app.local
        format: raw
    logging:
      driver: local

  migrate:
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE in .env.release.local}
    profiles: [migration]
    env_file:
      - path: ./.env.app.local
        format: raw

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.release.local}
      # Space-separated names that redirect to SITE_DOMAIN, e.g. www. and an old address.
      SITE_ALIASES: ${SITE_ALIASES:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local

volumes:
  caddy_data:
  caddy_config:
