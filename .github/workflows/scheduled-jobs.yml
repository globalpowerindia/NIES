name: Scheduled jobs

# Vercel Hobby runs cron once a day, but an unpaid order holds its stock for
# a 30-minute payment window. This calls the same job every 15 minutes so the
# stock comes back soon after the window closes (see
# src/app/api/cron/abandoned-carts/route.ts). GitHub may start scheduled runs
# a few minutes late; the job is safe to run at any time and any number of times.
#
# Needs two repository secrets: SITE_URL (the production origin, no trailing
# slash) and CRON_SECRET (the same value as on Vercel). Without them the run
# only prints a notice. Set them in one repository only, if the code is
# pushed to more than one.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduled job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_URL or CRON_SECRET is not set; nothing to call."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/abandoned-carts"
