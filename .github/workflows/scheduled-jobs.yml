name: Scheduled jobs (manual)

# Runs the scheduled job once, on demand, from the Actions tab: a backup for
# when the regular caller is down. The every-15-minutes schedule lives on
# cron-job.org instead (README → Scheduled jobs): GitHub bills each run as at
# least a minute, and 96 runs a day would use up a private repository's free
# Actions minutes, CI included, within the month.
#
# Needs two repository secrets: SITE_URL (the production origin, no trailing
# slash) and CRON_SECRET (the same value as on Vercel). Without them the run
# only prints a notice.

on:
  workflow_dispatch:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduled job
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_URL or CRON_SECRET is not set; nothing to call."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/abandoned-carts"
