# A disposable local Postgres for the database tests (the app itself uses Neon):
#   docker compose up -d test-db
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:54329/powertools_test
#   npm run test:db:migrate && npm run test:int
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: powertools_test
    ports:
      - '127.0.0.1:54329:5432'
    tmpfs:
      - /var/lib/postgresql/data
